[package]
name = "template-quote-impl"
version = "0.5.1"
edition = "2018"
rust-version = "1.54"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
description = "A new-fashioned quote! macro implementation with pretty template-engine-like syntax"
license = "MIT"
readme = "../README.md"
homepage = "https://github.com/yasuo-ozu/template_quote"
documentation = "https://docs.rs/template-quote-impl"
keywords = ["quote", "proc-macro", "macros", "template", "codegen"]
categories = ["development-tools::procedural-macro-helpers", "template-engine"]
repository = "https://github.com/yasuo-ozu/template_quote"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.40"
quote = "1.0"
