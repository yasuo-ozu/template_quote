name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses unstable options (wrap_comments), so format with nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  msrv:
    name: build (MSRV 1.56)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.56.0
      # cargo 1.56 has no MSRV-aware resolution, so it would otherwise pick the
      # latest dependency versions (which have since raised their own MSRV above
      # 1.56). Pin the crate's declared minimums plus the transitive deps that
      # bumped MSRV. This verifies the library builds on its declared MSRV with
      # its minimum-supported dependencies. (`cargo build` does not compile the
      # `trybuild` dev-dependency, so its newer toolchain requirement is moot.)
      - name: Pin MSRV-compatible dependency versions
        run: |
          cargo generate-lockfile
          cargo update -p quote --precise 1.0.35
          cargo update -p proc-macro2 --precise 1.0.79
          cargo update -p unicode-ident --precise 1.0.12
      - run: cargo build --workspace --locked
