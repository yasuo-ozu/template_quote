[package]
name = "template-quote"
version = "0.6.0"
edition = "2018"
rust-version = "1.54"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
description = "A new-fashioned quote! macro implementation with pretty template-engine-like syntax"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yasuo-ozu/template_quote"
documentation = "https://docs.rs/template-quote"
keywords = ["quote", "proc-macro", "macros", "template", "codegen"]
categories = ["development-tools::procedural-macro-helpers", "template-engine"]
repository = "https://github.com/yasuo-ozu/template_quote"


[dependencies]
template-quote-impl = { path = "./template_quote_impl", version = "0.6.0" }
quote = "1.0"
proc-macro2 = { version = "1.0.40", optional = true }

[dev-dependencies]
proc-macro2 = "1.0.40"
trybuild = "1.0"

[features]
default = ["proc-macro2"]

[workspace]
members = [".", "template_quote_impl", "test_crates/no_proc_macro2"]
resolver = "2"
